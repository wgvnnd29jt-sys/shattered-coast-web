<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flash in the Pan — Destiny Island</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root { --gold:#d4af37; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: Barlow, system-ui, sans-serif; color:#f3e6c8; min-height:100vh; background:#2a1a0e url("cabin-floor.jpg") center / cover no-repeat fixed; }
body:before { content:""; position:fixed; inset:0; background:rgba(20,10,4,.28); pointer-events:none; z-index:0; }
a { color:inherit; text-decoration:none; }
.wrap { width:min(1180px, calc(100% - 48px)); margin:0 auto; }
header { position:sticky; top:0; z-index:10; background:rgba(20,12,6,.88); border-bottom:1px solid rgba(212,175,55,.22); }
.bar { display:flex; align-items:center; gap:24px; height:82px; }
.brand { display:flex; align-items:center; gap:12px; }
.mark { width:52px; height:52px; border-radius:50%; object-fit:cover; }
.word strong { display:block; font-family:"Barlow Condensed", sans-serif; letter-spacing:.08em; font-size:20px; font-weight:800; }
.word em { display:flex; align-items:center; gap:8px; font-style:normal; font-size:11px; letter-spacing:.32em; color:var(--gold); margin-top:4px; }
.word em span { display:block; width:22px; height:1px; background:var(--gold); }
nav { margin-left:auto; display:flex; gap:26px; }
nav a { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#e8d7b0; }
.steam { border:1px solid var(--gold); color:var(--gold); padding:10px 16px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
nav .drop { position:relative; padding-bottom:8px; }
nav .menu { display:none; position:absolute; top:100%; left:50%; transform:translateX(-50%); min-width:200px; background:#2a1a0e; border:1px solid rgba(212,175,55,.28); padding:12px 0 8px; z-index:20; }
nav .drop:hover .menu, nav .drop:focus-within .menu { display:block; }
nav .menu a { display:block; padding:10px 16px; font-size:12px; color:var(--gold); }
.page { position:relative; z-index:1; min-height:calc(100vh - 82px); display:grid; place-items:center; text-align:center; padding:40px 0 80px; }
.stage { position:relative; width:min(420px,78vw); margin:0 auto 28px; }
.stage img { width:100%; height:auto; display:block; filter:drop-shadow(0 18px 28px rgba(0,0,0,.55)); }
.sparks { position:absolute; inset:0; pointer-events:none; }
.sparks i { position:absolute; width:6px; height:6px; background:#ffe9a0; border-radius:50%; box-shadow:0 0 8px 3px rgba(255,210,80,.85); animation:spark 1.6s ease-in-out infinite; }
.sparks i:nth-child(1) { left:62%; top:58%; }
.sparks i:nth-child(2) { left:68%; top:61%; width:4px; height:4px; animation-delay:.25s; }
.sparks i:nth-child(3) { left:58%; top:63%; animation-delay:.5s; }
.sparks i:nth-child(4) { left:72%; top:56%; width:3px; height:3px; animation-delay:.8s; }
.sparks i:nth-child(5) { left:64%; top:54%; animation-delay:1.1s; }
.sparks i:nth-child(6) { left:70%; top:64%; animation-delay:.35s; }
@keyframes spark { 0%,100%{opacity:.15;transform:scale(.4)} 40%{opacity:1;transform:scale(1.4)} 70%{opacity:.35;transform:scale(.7)} }
.badge { display:inline-block; border:1px solid var(--gold); color:var(--gold); font-size:11px; letter-spacing:.2em; text-transform:uppercase; padding:6px 12px; margin-bottom:16px; }
h1 { font-family:"Barlow Condensed", sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:.04em; font-size:clamp(36px,6vw,64px); color:#f4e2b0; }
.page p { max-width:42ch; margin:14px auto 0; line-height:1.65; color:#d9c49a; }
@media (max-width:720px){ nav { display:none; } }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <img class="mark" src="logo-navy.jpg" alt="Shattered Coast logo" />
      <div class="word"><strong>SHATTERED COAST</strong><em><span></span> INTERACTIVE <span></span></em></div>
    </a>
    <nav>
      <div class="drop"><a href="game-shattered-coast.html">Games</a><div class="menu"><a href="game-shattered-coast.html">Shattered Coast</a><a href="flash-in-the-pan.html">Flash in the Pan</a></div></div>
      <div class="drop"><a href="helm.html">Apps</a><div class="menu"><a href="helm.html">Home</a></div></div>
      <a href="who-we-are.html">Who We Are</a>
    </nav>
    <a class="steam" href="contact.html">Get in touch</a>
  </div>
</header>
<main class="wrap page">
  <div>
    <div class="stage">
      <img src="flash-in-the-pan.jpg" alt="Flash in the Pan — Destiny Island" />
      <div class="sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <span class="badge">Early development</span>
    <h1>Flash in the Pan</h1>
    <p>Gold prospecting on Destiny Island, a fictional island off the British Columbia coast. A third original title from Shattered Coast Interactive.</p>
  </div>
</main>
</body>
</html>
